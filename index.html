<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="A quiet workspace for diagrams, research, and ideas. Built with Bend.">
  <title>Borzoi — Diagrams</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div class="window is-full app">
    <aside class="side is-open" id="sidebar" aria-label="Projects">
      <div class="brand"><span class="brand-symbol" aria-hidden="true">B</span><div><strong class="item-title">Borzoi</strong><div class="detail">Room for thought.</div></div></div>
      <div class="side__body" id="project-list"></div>
      <div class="side-bottom"><button class="btn btn--ghost" id="new-project"><span aria-hidden="true">＋</span> New project</button><div class="separator"></div><button class="btn btn--ghost" id="backup">Download backup</button><button class="btn btn--ghost" id="import">Import backup</button><p class="detail">Saved on this device.<br>Your ideas stay with you.</p></div>
    </aside>
    <div class="window__main">
      <header class="toolbar app-toolbar"><button class="btn btn--ghost btn--icon" id="menu" aria-label="Toggle projects"><svg class="icon"><use href="#i-panel-left"/></svg></button><div class="breadcrumbs"><span id="project-name" class="detail"></span><span class="detail">/</span><span id="diagram-crumb" class="item-title"></span></div><span class="toolbar-spacer"></span><span id="save-status" class="detail" role="status">Saved locally</span><button class="btn btn--ghost btn--sm" id="history">History</button></header>
      <main class="workspace">
        <header class="document-head"><div><div class="eyebrow detail">DIAGRAM WORKSPACE</div><button id="rename-diagram" class="title-button" title="Rename diagram"><h1 id="diagram-title" class="heading"></h1></button><p class="detail" id="document-description">A little structure for your next idea.</p></div><div class="document-actions"><div class="segmented" id="mode" data-manual aria-label="Diagram mode"><button class="btn btn--ghost btn--sm" data-mode="view" aria-pressed="true">View</button><button class="btn btn--ghost btn--sm" data-mode="edit" aria-pressed="false">Edit</button></div><button class="btn btn--ghost btn--sm" id="export">Export .mmd</button></div></header>
        <div id="notice" class="notice detail" role="status" hidden></div>
        <section class="work-area" aria-label="Diagram workspace">
          <section id="editor-panel" class="editor-panel" hidden aria-label="Source editor"><div class="panel-heading"><span class="item-title">Source</span><button class="btn btn--ghost btn--sm" id="syntax-help">Syntax guide</button></div><label class="sr-only" for="source">Diagram source</label><textarea id="source" class="input input--mono" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><p id="parse-message" class="detail" aria-live="polite"></p><div class="editor-actions"><button class="btn btn--primary btn--sm" id="checkpoint">Save version</button><span class="detail">Drafts save automatically.</span></div></section>
          <section class="canvas-panel" aria-label="Diagram preview"><div class="canvas-caption"><span class="detail" id="graph-stats"></span><span class="tag">Bend</span></div><div class="canvas-scroll" id="canvas-scroll"><div id="diagram" class="diagram--soft"></div></div><footer class="canvas-footer"><span class="detail" id="graph-caption">Start with a question. Follow the connections.</span><button class="btn btn--ghost btn--sm" id="fit">Center</button></footer></section>
        </section>
        <footer class="workspace-footer"><span class="detail">Built with Bend. Made for thinking.</span><span class="detail">Borzoi · 0.1</span></footer>
      </main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-body"><div class="panel-heading"><h2 id="modal-title" class="section-title"></h2><button class="btn btn--ghost btn--sm" id="close-modal" aria-label="Close dialog">Close</button></div><div id="modal-content"></div></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json,.borzoi" hidden>
</body>
</html>
