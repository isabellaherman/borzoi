<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple tool for creating and editing diagrams.">
  <title>Borzoi — Diagrams</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body class="desk">
  <div class="window is-full" id="app">
    <aside class="side is-open" id="sidebar" aria-label="Projects">
      <div class="side__head"><span class="side__label item-title side__text">Borzoi</span></div>
      <div class="side__body" id="project-list"></div>
      <div class="side__footer">
        <button class="btn btn--ghost" id="new-project" title="New project"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="side__text">New project</span></button>
        <div class="separator"></div>
        <button class="btn btn--ghost" id="backup" title="Download backup"><svg class="icon" aria-hidden="true"><use href="#i-file-text"/></svg><span class="side__text">Download backup</span></button>
        <button class="btn btn--ghost" id="import" title="Import backup"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="side__text">Import backup</span></button>
        <p class="detail side__text side__caption">Saved on this device.</p>
      </div>
    </aside>
    <div class="window__main">
      <header class="toolbar">
        <button class="btn btn--ghost btn--icon" id="menu" aria-label="Toggle projects" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="#i-panel-left"/></svg></button>
        <nav class="breadcrumbs" aria-label="Current diagram"><span id="project-name" class="detail breadcrumbs__item"></span><span class="detail" id="project-separator">/</span><h1 id="diagram-crumb" class="item-title breadcrumbs__item"></h1></nav>
        <button id="rename-diagram" class="btn btn--ghost btn--sm">Rename</button>
        <span class="toolbar__spacer"></span><span id="save-status" class="detail status-text hide-narrow" role="status">Saved locally</span><button class="btn btn--ghost btn--sm" id="history">History</button>
      </header>
      <div class="toolbar" role="toolbar" aria-label="Diagram">
        <div class="segmented" id="mode" data-manual aria-label="Diagram mode"><button class="btn btn--ghost btn--sm" data-mode="view" aria-pressed="false">View</button><button class="btn btn--ghost btn--sm" data-mode="edit" aria-pressed="true">Edit</button></div>
        <span class="toolbar__spacer"></span><button class="btn btn--ghost btn--sm" id="checkpoint">Save version</button><button class="btn btn--ghost btn--sm" id="export">Export .mmd</button>
      </div>
      <main class="page"><div class="workbench">
        <div id="notice" hidden></div>
        <section class="workbench__panes" aria-label="Diagram workspace">
          <section id="editor-panel" class="panel workbench__pane" aria-label="Source editor">
            <header class="panel__header"><span class="item-title">Source</span><button class="btn btn--ghost btn--sm" id="syntax-help">Syntax guide</button></header>
            <div class="source-editor"><label class="field source-editor__field" for="source"><span class="field__label">Diagram source</span><textarea id="source" class="input input--mono" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></label><p id="parse-message" class="detail status-text" aria-live="polite"></p></div>
          </section>
          <section class="panel workbench__pane preview" aria-label="Diagram preview">
            <header class="panel__header"><span class="detail" id="graph-stats"></span><span class="tag">Bend</span></header><div class="preview__viewport" id="canvas-scroll"><div class="preview__content"><div id="diagram"></div></div></div><footer class="preview__footer"><span class="detail" id="graph-caption">Start with a question. Follow the connections.</span><button class="btn btn--ghost btn--sm" id="fit">Center</button></footer>
          </section>
        </section>
        <footer class="workbench__footer"><a class="detail link" href="https://github.com/isabellaherman/Bend-UI" target="_blank" rel="noopener noreferrer">Made with Bend-UI</a><span class="detail" id="app-version"></span></footer>
      </div></main>
    </div>
  </div>
  <dialog id="modal" class="dialog"><header class="dialog__header"><h2 id="modal-title" class="section-title"></h2><button class="btn btn--ghost btn--sm" id="close-modal" aria-label="Close dialog">Close</button></header><div id="modal-content" class="dialog__body"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json,.borzoi" hidden>
</body>
</html>
