<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple tool for creating and editing diagrams.">
  <title>Borzoi — Diagrams</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body class="desk">
  <div class="window is-full" id="app">
    <aside class="side is-open" id="sidebar" aria-label="Projects" data-side-multiple>
      <div class="side__head"><span class="side__label item-title side__text">Borzoi</span></div>
      <div class="side__body" id="project-list"></div>
      <div class="side__footer">
        <button class="btn btn--ghost" id="new-project" title="New project"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="side__text">New project</span></button>
        <div class="separator"></div>
        <button class="btn btn--ghost" id="backup" title="Download backup"><svg class="icon" aria-hidden="true"><use href="#i-file-text"/></svg><span class="side__text">Download backup</span></button>
        <button class="btn btn--ghost" id="import" title="Import backup"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="side__text">Import backup</span></button>
        <p class="detail side__text side__caption">Saved on this device.</p>
      </div>
    </aside>
    <div class="window__main">
      <header class="toolbar">
        <button class="btn btn--ghost btn--icon" id="menu" aria-label="Toggle projects" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="#i-panel-left"/></svg></button>
        <nav class="breadcrumbs" aria-label="Current diagram"><span id="project-name" class="detail breadcrumbs__item"></span><span class="detail" id="project-separator">/</span><h1 id="diagram-crumb" class="item-title breadcrumbs__item"></h1></nav>
                <span class="toolbar__spacer"></span><span id="save-status" class="detail status-text hide-narrow" role="status">Saved locally</span><button class="btn btn--ghost btn--sm" id="history">History</button>
      </header>
      <div class="toolbar" role="toolbar" aria-label="Diagram">
        <div class="dropdown" id="mode"><button class="btn btn--ghost btn--sm" id="mode-trigger" aria-haspopup="menu" aria-expanded="false">Edit mode</button><div class="menu" role="menu" hidden></div></div><button class="btn btn--ghost btn--sm" id="add-node"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Add node</button><button class="btn btn--ghost btn--icon btn--round" id="layout" aria-pressed="false" aria-label="Manual layout" hidden><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><svg class="status-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" pathLength="100"/></svg></button>
        <span class="toolbar__spacer"></span><span id="manual-note" hidden><span class="tag tag--warning">Manual layout · positions in %% lines</span><button class="btn btn--ghost btn--sm" id="why">Why?</button></span><span class="detail status-text hide-narrow" id="graph-stats"></span><span class="toolbar__sep" id="actions-separator"></span><button class="btn btn--ghost btn--sm" id="checkpoint"><span class="btn__swap" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-circle-check"/></svg><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg></span>Save version</button><button class="btn btn--ghost btn--sm" id="export"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Export .mmd</button>
      </div>
      <main class="page" id="canvas-scroll" aria-label="Diagram"><div class="workbench">
        <div id="notice" hidden></div>
        <div id="diagram"></div>
      </div></main>
      <section id="editor-panel" class="panel window__dock" aria-label="Source editor">
        <header class="panel__header"><span class="item-title">Source</span><button class="btn btn--ghost btn--sm" id="syntax-help">Syntax guide</button></header>
        <div class="source-editor"><label class="field source-editor__field" for="source"><span class="field__label">Diagram source</span><textarea id="source" class="input input--mono" cols="40" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></label><p id="parse-message" class="detail status-text" aria-live="polite"></p></div>
      </section>
      <p class="detail window__foot"><a class="link" href="https://github.com/isabellaherman/Bend-UI" target="_blank" rel="noopener noreferrer">Made with Bend-UI</a></p>
      <p class="detail window__foot window__foot--end" id="app-version"></p>
    </div>
  </div>
  <dialog id="modal" class="dialog"><header class="dialog__header"><h2 id="modal-title" class="section-title"></h2><button class="btn btn--ghost btn--sm" id="close-modal" aria-label="Close dialog">Close</button></header><div id="modal-content" class="dialog__body"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json,.borzoi" hidden>
</body>
</html>
